---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: browser-sync
  annotations:
    cert-manager.io/cluster-issuer: ca-cluster-issuer
spec:
  parentRef:
    namespace: cilium
    name: cilium
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
  - name: preview
    hostname: preview.dashboard.home.arpa
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: preview-dashboard-cert
  - name: api-preview
    hostname: api.preview.dashboard.home.arpa
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: api-preview-dashboard-cert

  - name: browser-sync
    hostname: browser-sync.dashboard.home.arpa
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: browser-sync-dashboard-cert
