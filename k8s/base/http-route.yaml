---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
spec:
  hostnames:
  - dashboard.cluster.local
  parentRefs:
  - name: dashboard
    kind: ListenerSet
    group: gateway.networking.k8s.io
    sectionName: dashboard
  rules:
  - backendRefs:
    - name: dashboard
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
